name: validate-corpus
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural validation (records, IDs, spans, coverage, baselines)
        run: |
          python3 work/validate_complete_corpus.py > /tmp/validate.json
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/validate.json'))['summary']
          print(s)
          assert s['errors'] == 0 and s['duplicate_source_ids'] == 0 and s['records'] == 5361
          PY
      - name: Source-text digest must be unchanged
        run: |
          python3 work/audit_corpus.py | tee /tmp/audit.json
          grep -q 'bfe3989e4c4fc239922d22d07bddac0414da81ad4c1de5c9e8fbf5b2150a0715' /tmp/audit.json
      - name: Pending-status inheritance
        run: python3 work/check_retrieval_inheritance.py
