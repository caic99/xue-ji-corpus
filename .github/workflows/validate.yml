name: validate-corpus
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural validation (records, IDs, spans, coverage, baselines)
        run: |
          python3 work/validate_complete_corpus.py > /tmp/validate.json
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/validate.json'))['summary']
          print(s)
          assert s['errors'] == 0 and s['duplicate_source_ids'] == 0 and s['records'] == 5361
          PY
      - name: Source-text digest must be unchanged
        run: |
          python3 work/audit_corpus.py | tee /tmp/audit.json
          grep -q 'a719e844641d9b610848a923e108f663d0fc1620d4f28c26f1925bfc9d5d27aa' /tmp/audit.json
      - name: Pending-status inheritance
        run: python3 work/check_retrieval_inheritance.py

      - name: Reproduce frozen research roster and exact candidate spans
        run: python3 research/reproduce_sample.py
      - name: Reproduce model-selected observations and dated snapshot reconciliation
        run: |
          python3 research/build_close_read_160.py
          python3 research/check_sample_snapshots.py
          python3 research/build_extended_kcly.py
          python3 research/build_extended_kcly.py --work ZTLY
          python3 research/build_extended_kcly.py --work NKCZ
          python3 research/build_event_pilot.py
          python3 research/build_event_pilot.py --work NKCZ
          python3 research/check_scan_spots.py
      - name: Reject invalid provenance, spans, verification and query claims
        run: python3 -m unittest discover -s research -p 'test_close_read_160.py' -v

      - name: Publication metadata boundary
        run: python3 research/check_publication.py
